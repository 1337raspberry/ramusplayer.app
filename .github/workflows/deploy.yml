name: Deploy to GitHub Pages

# The build reads the latest ramus release from the GitHub API, so the site
# is rebuilt whenever it might be stale:
#   - push to main (site changes)
#   - repository_dispatch "ramus-release", sent by the ramus repo when a
#     release is published (needs a token there with access to this repo)
#   - a daily schedule as a fallback. GitHub disables schedules in public
#     repositories after 60 days without activity; the dispatch covers that.
#   - workflow_dispatch, for a manual rebuild from the Actions tab
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [ramus-release]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Each job gets only what it needs: the build reads the repo, the deploy
# publishes to Pages.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build and upload
        # Third-party action pinned to a commit, so a moved tag can't change it.
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
