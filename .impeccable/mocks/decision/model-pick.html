<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Bins sketch</title>
<style>
  * { box-sizing:border-box; margin:0; }
  body { width:1440px; height:900px; background:#2E2A27; font-family:"Marker Felt","Helvetica Neue",Arial,sans-serif; overflow:hidden; position:relative; color:#F3F2EE; }
  .title { position:absolute; left:72px; top:56px; font-size:120px; font-weight:800; letter-spacing:-.03em; font-family:"Helvetica Neue",Arial,sans-serif; }
  .tag { position:absolute; left:76px; top:196px; font-size:32px; font-family:"Helvetica Neue",Arial,sans-serif; opacity:.8; }
  .sticker { position:absolute; right:110px; top:70px; width:220px; height:220px; border-radius:50%; background:#FF6A1F; color:#141414; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:46px; font-weight:900; transform:rotate(-8deg); font-family:"Helvetica Neue",Arial,sans-serif; }
  .sticker small { font-size:24px; }
  .bin { position:absolute; left:0; right:0; bottom:0; height:520px; }
  .div { position:absolute; bottom:0; width:1200px; left:120px; background:#F3F2EE; color:#141414; border-radius:6px 6px 0 0; }
  .tab { position:absolute; top:-64px; height:64px; padding:10px 28px; background:#F3F2EE; border-radius:10px 10px 0 0; font-size:40px; color:#141414; }
  .d1 { height:300px; } .d1 .tab { left:40px; }
  .d2 { height:360px; left:150px; background:#E6E4DE; } .d2 .tab { left:300px; background:#E6E4DE; }
  .d3 { height:420px; left:180px; background:#D9D6CF; } .d3 .tab { left:620px; background:#D9D6CF; }
  .shot { position:absolute; left:260px; bottom:310px; width:900px; height:220px; background:linear-gradient(135deg,#3a3f78,#7a5d8f 60%,#2f3463); }
  .front { position:absolute; left:0; right:0; bottom:0; height:120px; background:#1E1A18; }
</style></head><body>
  <div class="title">ramus</div>
  <div class="tag">a genre-first music player for plex</div>
  <div class="sticker">FREE<small>all platforms</small></div>
  <div class="bin">
    <div class="div d3"><div class="tab">SHOEGAZE</div></div>
    <div class="shot"></div>
    <div class="div d2"><div class="tab">POST-ROCK</div></div>
    <div class="div d1"><div class="tab">ROCK</div></div>
    <div class="front"></div>
  </div>
</body></html>
